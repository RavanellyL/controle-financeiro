
name: Testes e Seguranca

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes-e-seguranca:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: controle_financeiro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d controle_financeiro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: Backend

    env:
      DATABASE_URL: postgresql://postgres:test_password@localhost:5432/controle_financeiro_test
      SECRET_KEY: ci_test_secret_key_only_for_github_actions_123456789
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Backend/requirements*.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Executar testes automatizados
        run: python -m pytest -v

      - name: Analise estatica com Bandit
        run: bandit -r . -x ./tests,./.venv,./venv,./site-packages

      - name: Verificar vulnerabilidades nas dependencias
        run: pip-audit
